name: Submit to Spec Kit Catalog

on:
  release:
    types: [published]

jobs:
  submit-catalog:
    name: Update docs and file catalog issue
    runs-on: ubuntu-latest

    steps:
      - name: Parse version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT00:00:00Z)" >> $GITHUB_OUTPUT

      - name: Checkout spec-kit-squad
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: File catalog submission issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DATE: ${{ steps.version.outputs.date }}
          DOWNLOAD_URL: https://github.com/jwill824/spec-kit-squad/archive/refs/tags/${{ steps.version.outputs.tag }}.zip
        run: |
          python3 - << 'PYEOF'
          import yaml, os

          with open('extension.yml') as f:
              ext = yaml.safe_load(f)

          speckit_version = ext.get('requires', {}).get('speckit_version', '>=0.1.0')
          commands_count  = len(ext.get('provides', {}).get('commands', []))
          hooks_count     = len(ext.get('hooks', {}))

          tools = ext.get('requires', {}).get('tools', [])
          if tools:
              lines = []
              for t in tools:
                  req = 'required' if t.get('required') else 'optional'
                  lines.append(f"- {t['name']} {t.get('version', '')} ({req})")
              required_tools = '\n'.join(lines)
          else:
              required_tools = 'None'

          substitutions = {
              '$VERSION':        os.environ['VERSION'],
              '$TAG':            os.environ['TAG'],
              '$DATE':           os.environ['DATE'],
              '$DOWNLOAD_URL':   os.environ['DOWNLOAD_URL'],
              '$SPECKIT_VERSION': speckit_version,
              '$COMMANDS_COUNT': str(commands_count),
              '$HOOKS_COUNT':    str(hooks_count),
              '$REQUIRED_TOOLS': required_tools,
          }

          with open('.github/templates/catalog-submission.md') as f:
              content = f.read()

          for placeholder, value in substitutions.items():
              content = content.replace(placeholder, value)

          with open('/tmp/catalog-submission-final.md', 'w') as f:
              f.write(content)
          PYEOF

          issue_url=$(gh issue create \
            --repo github/spec-kit \
            --title "Extension Submission: Squad Bridge v${VERSION}" \
            --body-file /tmp/catalog-submission-final.md \
            --label "extension-submission" \
            --label "enhancement" \
            --label "needs-triage")
          echo "url=$issue_url" >> $GITHUB_OUTPUT

      - name: Write job summary
        run: |
          echo "## 📦 Catalog issue filed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Issue:** ${{ steps.issue.outputs.url }}" >> $GITHUB_STEP_SUMMARY
